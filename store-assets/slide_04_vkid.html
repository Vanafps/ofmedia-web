<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Slide 04 - VK ID Auth</title>
  <style>
    @font-face {
      font-family: 'Bebas Cyrillic';
      src: url('./bebasneuecyrillic.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #070709;
      background-image: 
        radial-gradient(ellipse 900px 550px at 50% 12%, rgba(255, 92, 0, 0.28) 0%, transparent 70%),
        radial-gradient(circle 700px at 85% 55%, rgba(0, 119, 255, 0.16) 0%, transparent 65%),
        radial-gradient(circle 600px at 15% 75%, rgba(255, 92, 0, 0.14) 0%, transparent 60%),
        radial-gradient(ellipse 1000px 450px at 50% 98%, rgba(255, 92, 0, 0.25) 0%, transparent 70%);
      color: #ffffff;
      font-family: 'Graphik', 'Montserrat', 'Inter', -apple-system, sans-serif;
      position: relative;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: 
        linear-gradient(#ffffff 1px, transparent 1px),
        linear-gradient(90deg, #ffffff 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 65px;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(18, 18, 24, 0.85);
      border: 1px solid rgba(255, 92, 0, 0.4);
      border-radius: 9999px;
      padding: 10px 28px;
      box-shadow: 0 0 35px rgba(255, 92, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
    }
    .brand-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255, 92, 0, 0.5));
    }
    .brand-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
    }
    .brand-tag {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ff7a1a;
      text-shadow: 0 0 15px rgba(255, 92, 0, 0.5);
    }

    /* Grand Headline */
    .headline {
      font-family: 'Bebas Cyrillic', 'Bebas Neue', Impact, sans-serif;
      font-size: 94px;
      line-height: 0.94;
      letter-spacing: 2px;
      text-align: center;
      margin-top: 26px;
      background: linear-gradient(180deg, #ffffff 0%, #f4f4f5 55%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 45px rgba(255, 92, 0, 0.25));
    }

    .subtitle {
      font-family: 'Graphik', 'Montserrat', 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.38;
      text-align: center;
      color: #d4d4d8;
      margin-top: 16px;
      max-width: 900px;
      padding: 0 20px;
    }

    /* Specs Badges */
    .badges-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 26px;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 18, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      border-radius: 9999px;
      padding: 12px 24px;
      font-size: 20px;
      font-weight: 600;
      color: #f4f4f5;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .badge-orange {
      background: rgba(255, 92, 0, 0.12);
      border-color: rgba(255, 92, 0, 0.45);
      color: #ff9142;
      box-shadow: 0 0 25px rgba(255, 92, 0, 0.25);
    }
    .badge svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
    }

    /* 3D Showcase Container */
    .showcase-stage {
      position: absolute;
      top: 550px;
      bottom: -120px;
      width: 1000px;
      display: flex;
      justify-content: center;
      perspective: 1200px;
    }

    /* Phone Chassis */
    .phone-chassis {
      position: relative;
      width: 720px;
      height: 1480px;
      border-radius: 54px;
      background: #0d0d12;
      border: 10px solid #23232c;
      outline: 2px solid rgba(255, 92, 0, 0.4);
      box-shadow: 
        0 40px 100px -15px rgba(0, 0, 0, 0.95),
        0 0 100px rgba(255, 92, 0, 0.35);
      overflow: hidden;
      z-index: 20;
    }

    .island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 135px;
      height: 32px;
      background: #000;
      border-radius: 9999px;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 16px;
    }
    .island-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #181822;
      border: 1px solid #2d2d3d;
    }

    .screen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* Floating Feature Badges */
    .floating-card-left {
      position: absolute;
      left: 15px;
      top: 360px;
      width: 320px;
      background: rgba(18, 18, 24, 0.92);
      border: 2px solid rgba(0, 119, 255, 0.65);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), 0 0 40px rgba(0, 119, 255, 0.35);
      z-index: 35;
      transform: rotate(-6deg);
    }
    .floating-card-right {
      position: absolute;
      right: 15px;
      top: 680px;
      width: 310px;
      background: rgba(18, 18, 24, 0.92);
      border: 2px solid rgba(255, 92, 0, 0.65);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 45px rgba(255, 92, 0, 0.35);
      z-index: 35;
      transform: rotate(6deg);
    }
    .floating-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0077ff, #0055cc);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 119, 255, 0.45);
      flex-shrink: 0;
    }
    .floating-icon-box-orange {
      background: linear-gradient(135deg, #ff5c00, #ff7a1a);
      box-shadow: 0 8px 20px rgba(255, 92, 0, 0.45);
    }
    .floating-icon-box svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }
    .floating-title {
      font-family: 'Bebas Cyrillic', sans-serif;
      font-size: 26px;
      color: #fff;
      letter-spacing: 1px;
    }
    .floating-sub {
      font-size: 15px;
      color: #a1a1aa;
      margin-top: 3px;
    }

    /* Bottom Floating Call-To-Action */
    .floating-cta {
      position: absolute;
      bottom: 120px;
      z-index: 50;
      background: linear-gradient(135deg, #ff5c00, #ff7a1a);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      padding: 20px 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(255, 92, 0, 0.7);
    }
    .floating-cta svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }
    .floating-cta-text {
      font-family: 'Bebas Cyrillic', sans-serif;
      font-size: 34px;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="container">
    <!-- Official OFMEDIA Logo at Top -->
    <div class="brand-header">
      <img class="brand-logo-img" src="./assets/ofmediawhite_clean.png" alt="OFMEDIA" />
      <div class="brand-divider"></div>
      <span class="brand-tag">АВТОРИЗАЦИЯ</span>
    </div>

    <!-- Grand Typography: Bebas Cyrillic -->
    <h1 class="headline">ВХОД В ОДИН КЛИК ЧЕРЕЗ VK ID</h1>
    <p class="subtitle">Быстрая авторизация, история просмотров и синхронизация избранного</p>

    <!-- Specs Badges -->
    <div class="badges-row">
      <div class="badge badge-orange">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        Вход за 1 секунду
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff7a1a"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        Личная библиотека
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff7a1a"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        Гостевой режим
      </div>
    </div>

    <!-- 3D Cinema Showcase -->
    <div class="showcase-stage">
      <!-- Left Floating Card -->
      <div class="floating-card-left">
        <div class="floating-icon-box">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <div>
          <div class="floating-title">VK ID ОДНИМ ТАПОМ</div>
          <div class="floating-sub">Без паролей и подтверждений</div>
        </div>
      </div>

      <!-- Right Floating Card -->
      <div class="floating-card-right">
        <div class="floating-icon-box floating-icon-box-orange">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div>
          <div class="floating-title">ИЗБРАННОЕ И СПИСКИ</div>
          <div class="floating-sub">Все закладки сохранены</div>
        </div>
      </div>

      <!-- Flagship Phone Chassis -->
      <div class="phone-chassis">
        <div class="island">
          <div class="island-dot"></div>
        </div>
        <img class="screen-img" src="./screenshots/vkid_onetap.png" alt="VK ID OneTap" />
      </div>

      <!-- Bottom Floating Call-To-Action -->
      <div class="floating-cta">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span class="floating-cta-text">СИНХРОНИЗАЦИЯ НА ВСЕХ УСТРОЙСТВАХ</span>
      </div>
    </div>
  </div>
</body>
</html>
