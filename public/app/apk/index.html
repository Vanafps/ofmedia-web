    body {

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #101012;
      border: 1px solid rgba(255, 255, 255, 0.12);

      padding: 36px 28px;
      max-width: 440px;
      width: 100%;

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ff5c00;

    }
    .spinner {

      height: 44px;
      border: 3px solid rgba(255, 92, 0, 0.2);
      border-top-color: #ff5c00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;

    @keyframes spin {

    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: #ff5c00;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border-radius: 14px;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover {
      background: #e05200;
      transform: scale(1.02);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #52525b;
    }
    .back {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      color: #71717a;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back:hover {

</head>

</html>
